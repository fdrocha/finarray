[project]
name = "finarray"
version = "0.2.0"
description = "xarray-backed intraday bars: per-date (ticker, time) panels with lazy per-variable loading"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabio Rocha" }]
requires-python = ">=3.11"
keywords = ["xarray", "finance", "bars", "intraday", "timeseries", "netcdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.1.0",
    "netCDF4>=1.6",
    "tqdm>=4.64",
]

[project.optional-dependencies]
# Deliberately loose: let the installer pick whatever numba has wheels for the
# target platform. numba pins numpy tightly, so this extra constrains the whole
# environment's numpy -- which is exactly why it is an extra and not a dependency.
backtest = ["numba>=0.59"]

[project.urls]
Homepage = "https://github.com/fdrocha/finarray"
Repository = "https://github.com/fdrocha/finarray"
Issues = "https://github.com/fdrocha/finarray/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finarray"]

[dependency-groups]
dev = [
    # Upper bound is a local-environment concern, not a library constraint:
    # llvmlite >=0.45 ships no macOS x86_64 wheel and builds against LLVM from
    # source. The published `backtest` extra above stays unpinned.
    "numba>=0.59,<0.62",
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pandas-stubs",
]
# Everything needed to run the suite, minus numba: used by CI to check that the
# backtest kernels' pure-Python fallback still works.
ci-minimal = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:finarray.*",
    # netCDF4 wheels are built against an older numpy ABI than uv resolves
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "SIM108",  # ternary is not always more readable
    "B905",    # zip(strict=) is 3.10+, but explicit is noisy here
]

[tool.mypy]
python_version = "3.11"
files = ["src/finarray"]
ignore_missing_imports = true
warn_unused_ignores = false
