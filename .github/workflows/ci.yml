name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check src tests examples
          uv run ruff format --check src tests examples

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

  # The backtest extra is optional and the kernels have a pure-Python fallback,
  # so make sure the package still works with numba absent.
  test-without-numba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync without the backtest extra
        run: uv sync --no-dev --group ci-minimal

      # --no-sync, or `uv run` would reinstall the default dev group (and numba)
      - name: Test
        run: uv run --no-sync pytest
